[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnam"
version = "1.0.0"
description = "Distributed Lag Neural Additive Models for interpretable count and binary regression"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Calle Helmersson" },
    { name = "Shivang Pandey" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]
paper = [
    "pyarrow>=12",
    "psutil>=5.9",
]

[tool.setuptools]
packages = ["dlnam", "dlnam.terms"]
